[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "green-inference"
version = "0.1.0"
description = "Sub-Watt Saccadic Vision & Power-Aware KV-Cache Engine for Hyperscale Agent Data Centers."
readme = "README.md"
authors = [
  { name = "Ahmed Hassan", email = "ahmed@a2zsoc.com" }
]
license = { text = "Apache-2.0" }
keywords = [
  "green-ai",
  "datacenter-power-optimization",
  "llm-energy-efficiency",
  "kv-cache-compression",
  "vlm-inference-optimization",
  "thermal-aware-scheduling",
  "edge-ai-power",
  "saccadic-vision",
  "gpu-power-capping",
  "pue-optimization",
  "carbon-aware-computing",
  "energy-efficient-ai"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
green-inference = "green_inference.cli:main"
